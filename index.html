<!-- ==========================================
    APP CONTRACTS
    Goal: Describe the required behavior and known edge-case regressions to avoid. Do not dictate specific code implementations unless strictly necessary for cross-system compatibility. Don't harm code that satisfies these rules without user consent. Suggest new or edited rules where appropriate.
    Note for AI Assistants: Comprehensive project history, user intent, and regression pitfalls are documented in CONTEXT.md (and online at https://raw.githubusercontent.com/inarius/meeting-time/main/CONTEXT.md). Review it.

    1. PLAYBACK & NAVIGATION
    - Passive: Passive actions (touching, scrolling) do not pause. 
    - Active: Intentional navigation (clicking a tab, using next/prev) pauses.
    - Auto-Resume: Returning to the current timeline item auto unpauses.
    - Time Sync: If unpaused, presentation auto-advances at the next real-time milestone.
    - Swipe Nav: Swiping left/right on the presentation view MUST shift to the prev/next agenda item.
    - Keyboard Nav: Left and Right arrow keys navigate to prev/next.

    2. WAKE LOCK & FULLSCREEN
    - Acquisition: Request wake lock on play/resume.
    - Persistence: Prevent the device screen from sleeping while actively playing or paused. 
    - Recovery: Re-acquire wake lock when returned to foreground (from the background).
    - Graceful Degradation: If a browser rejects fullscreen requests (e.g., iOS Safari), the app must catch the error and advise the user to add the app to their home screen.

    3. UI & LAYOUT
    - Viewport Integrity: Match the visible screen height. Account for mobile browser UI bars appearing/disappearing and avoid Android PWA rendering race conditions upon launch.
    - View Snapping: Vertical scroll locks to either the Presentation view or the Management view, never resting halfway between them.
    - Button Accessibility: Buttons retain visible borders and high contrast.
    - Play/Pause Visibility: Pause button defaults to semi-transparent (displayed while playing), "Resume" button defaults to opaque (displayed while paused).
    - Responsive: Landscape mode uses a two-column grid. Portrait mode collapses into a stacked single-column flex layout.

    4. SIDE CARDS / TABS
    - Tab buttons: Displayed as vertical tabs anchored to the right edge.
    - Rotation: The presentation cycles between the main agenda (shown longer) and enabled side cards (shown briefly).
    - Sliding: Card content areas slide in from the right when activated, layering over the main agenda. Cycling back to agenda unslides them back out to the right.
    - Visual Cues: Tabs provide a visual time-remaining indicator (progress fill) and physically animate (bounce/tug) before sliding out.

    5. DATA, STORAGE & IMPORT
    - URL State: The agenda state must be continuously compressed and mirrored to the URL hash to allow seamless sharing of the live configuration.
    - Undo Stack: Destructive edits (add, delete, update) push the current state to Undo stack before saving.
    - Bidirectional Import: The format exported to the Import/Edit modal must be parseable back into the app without data loss.
    - Import Formatting: Raw text uses standard `HH:MM AM/PM Topic` for agenda items, `-` for lists, `--` for sub-lists, and `=== TABS ===` with `# Tab Name [x]` for side cards.
    - Destructive Import: Import wipes the undo stack during agenda overwrite and MUST warn the user via confirm dialog before saving.

    6. BUTTON BEHAVIORS
    - Share: Copies the current full URL (with compressed hash state) to the clipboard and reports copied URL length to user.
    - Theme: Toggles dark/light and saves to local storage.
    - Refresh: Twirls the refresh icon, checks the document modified headers, and reloads page once a newer server version exists.

    7. DEBUG PANEL
    - Fast Cycle: Replaces normal display duration with a rapid 5-second cycle for rapid visual testing of tab rotations and animations.
    - Monitor: Real-time read-out of the Screen Wake Lock API status (Active, Released, Failed, Unsupported).
    - Clear: Destructive button clears all local storage.

    8. PRESENTATION DISPLAY & SCALING
    - Landscape Scaling: Text and UI elements scale proportionally, should look similar and fill all landscape devices both large and small resolution.
    - Mobile Portrait Lock: In portrait mode, text sizing must decouple from screen height to prevent oversized text, maintaining a compact, readable layout.
    - Fluid Indentation: Padding and margins on lists must scale proportionally with the font size so that bullets are never pushed outside the visible container when text enlarges.
    - Wrapping: Meeting title and agenda item titles wrap to multiple lines if needed. The Next Up section does not wrap and truncates to ellipses when required.
    - Scrollbars: Main horizontal and vertical scrollbars MUST be hidden on root and main containers to prevent double-scrollbar overflow, though inner elements (like long sidecards) MAY still scroll natively.


    9. RENDER TIMING
    - Pagination Calculation: Any function measuring DOM nodes to calculate text pagination must wait for mobile browser UI bars and orientation shifts to fully settle before measuring available height.
========================================== -->

    <!-- Viewport Height Fix for Mobile Apps -->
    <script>
        function setViewportHeight() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', () => setTimeout(setViewportHeight, 100));
    </script>

    <!--    GLOBAL CONFIGURATION (EASY ACCESS)      -->
    <!-- ========================================== -->
    <script>
        const APP_CONFIG = {
            appearance: {
                defaultTheme: 'light'    // Options: 'light' or 'dark'
            },
            timing: {
                agendaDuration: 40,      // Seconds the main agenda is displayed
                cardDuration: 20,        // Seconds each sidecard tab is displayed
                debugDuration: 5,        // Seconds for fast cycle simulation mode
                bounceLeadTime: 3,       // Seconds before tab transition to trigger the "bounce/tug" animation
                carouselInterval: 8000,  // Milliseconds between flipping pages of long text
                refreshTimeout: 180000   // Milliseconds before auto-refresh check gives up
            },
            swipe: {
                deadzone: 25,            // Pixels to swipe before registering the action
                dragDistance: 70         // Pixels to swipe to complete the transition
            },
            storage: {
                agendaKey: 'boardAgenda',
                tabsKey: 'boardTabs',
                themeKey: 'boardTheme',
                titleKey: 'boardMeetingTitle'
            },
            history: {
                maxItems: 20             // Undo history stack limit
            }
        };
    </script>

    <style>
        :root, html[data-theme="light"] {
            --alert-bg: #ffedd5; --alert-border: #fed7aa; --alert-lbl: #9a3412; --alert-txt: #0f172a;
            --active-bg: #bae6fd; --active-txt: #0369a1; --active-border: #0284c7;
            --ts-color: #8ca3ba; --btn-border: #94a3b8;
            --swipe-bg: rgba(3, 105, 161, 0.6);
            --swipe-ready-color: #0284c7;

            /* Live Prototyping Design Tokens */
            --proto-scale: 1;
            --proto-left-col: 35%;
            --proto-title-scale: 1;
            --proto-details-scale: 1;
            --proto-nextup-scale: 1;
        }
        html[data-theme="dark"] {
            --alert-bg: #431407; --alert-border: #f97316; --alert-lbl: #fed7aa; --alert-txt: #f8fafc;
            --active-bg: #1e3a8a; --active-txt: #38bdf8; --active-border: #38bdf8;
            --ts-color: #94a3b8; --btn-border: #475569;
            --swipe-bg: rgba(56, 189, 248, 0.6);
            --swipe-ready-color: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* Hidden Main Scrollbars to prevent double-scroll rendering issues on desktop */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--pico-muted-border-color); border-radius: 4px; }
        body::-webkit-scrollbar, html::-webkit-scrollbar, .app-container::-webkit-scrollbar, 
        .presentation-view::-webkit-scrollbar, .management-view::-webkit-scrollbar { display: none; }
        
        body, html { 
            height: 100%; height: calc(var(--vh, 1vh) * 100); width: 100%; 
            overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; 
            scrollbar-width: none; -ms-overflow-style: none; /* Hide main scrollbar */
        }
        
        .app-container { display: flex; flex-direction: column; width: 100%; scrollbar-width: none; }

        .presentation-view, .management-view {
            width: 100%; height: 100%; height: calc(var(--vh, 1vh) * 100); max-height: calc(var(--vh, 1vh) * 100); 
            scroll-snap-align: start; scroll-snap-stop: always; scrollbar-width: none;
            padding: 2% 3.5%; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;
        }
        .presentation-view { background: var(--pico-background-color); border-bottom: 4px solid var(--pico-muted-border-color); position: relative; touch-action: pan-y; }
        
        /* Allowed internal scrollbars */
        .tab-content-area, .timeline-rows { scrollbar-width: auto; }

        .swipe-overlay { position: absolute; top: 0; bottom: 0; width: 85px; display: flex; align-items: center; pointer-events: none; z-index: 50; transition: opacity 0.1s linear; }
        .swipe-left { left: 0; justify-content: flex-start; padding-left: 15px; background: linear-gradient(to right, var(--swipe-bg), transparent); }
        .swipe-right { right: 0; justify-content: flex-end; padding-right: 15px; background: linear-gradient(to left, var(--swipe-bg), transparent); }
        .swipe-icon-wrapper { transition: transform 0.1s linear; }
        .swipe-icon { font-size: 2.5rem; color: var(--ts-color); font-weight: 900; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .swipe-ready .swipe-icon { transform: scale(1.4); color: var(--swipe-ready-color); filter: drop-shadow(0 0 6px var(--swipe-ready-color)); }

        /* BASE SCALING (Designed for Desktop proportional matching based on vh) */
        .playback-toggle-btn {
            position: absolute; bottom: 20px; right: 55px; z-index: 100;
            padding: clamp(4px, 1.5vh, 12px) clamp(14px, 3vh, 24px); 
            font-size: calc(clamp(0.8rem, 3vh, 2.5rem) * var(--proto-scale, 1)); font-weight: 800; border-radius: 20px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: all 0.2s; border: none; margin: 0; 
            opacity: 0.9; 
        }
        .playback-toggle-btn:active { transform: scale(1.05); opacity: 1 !important; }
        @media (hover: hover) { .playback-toggle-btn:hover { transform: scale(1.05); opacity: 1 !important; } }
        
        .playback-playing { background: transparent !important; box-shadow: none !important; font-size: calc(clamp(1.4rem, 4.5vh, 3.5rem) * var(--proto-scale, 1)); padding: 0 8px; color: var(--ts-color) !important; opacity: 0.3 !important; }

        .tab-sidebar { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: clamp(8px, 1.5vh, 16px); z-index: 100; }
        .vertical-tab { 
            writing-mode: vertical-rl; padding: clamp(12px, 3vh, 24px) clamp(6px, 1.5vh, 12px); border: none; border-radius: 8px 0 0 8px; 
            color: white; font-weight: 800; font-size: calc(clamp(0.9rem, 3.5vh, 2.5rem) * var(--proto-scale, 1)); cursor: pointer; opacity: 0.85; 
            transition: all 0.2s, transform 0.2s; margin: 0; display: flex; align-items: center; 
            justify-content: center; letter-spacing: 1px; box-shadow: -2px 0 6px rgba(0,0,0,0.1); 
            position: relative; overflow: hidden;
        }
        .vertical-tab:hover, .vertical-tab.active { opacity: 1; transform: scale(1.05) translateX(-2px); box-shadow: -4px 0 12px rgba(0,0,0,0.2); }
        .tab-progress { position: absolute; top: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.25); z-index: 1; }
        @keyframes softTug { 0% { transform: translateX(0); } 30% { transform: translateX(-16px); } 60% { transform: translateX(4px); } 100% { transform: translateX(0); } }
        .vertical-tab.bounce { animation: softTug 0.85s cubic-bezier(0.22, 1, 0.36, 1); }

        .presentation-grid { display: grid; grid-template-columns: minmax(260px, var(--proto-left-col, 35%)) 1fr; gap: 24px; height: 100%; position: relative; z-index: 5; }
        .status-panel { display: flex; flex-direction: column; justify-content: space-between; padding-right: 16px; position: relative; z-index: 2; overflow: hidden; }
        .status-panel::after { content: ""; position: absolute; right: 0; top: 0; height: calc(100% - 75px); width: 2px; background: var(--pico-muted-border-color); }

        .meeting-title-bar { background: #1e293b; color: #f8fafc; padding: 8px 12px; border-radius: 6px; font-size: calc(clamp(0.85rem, 3.5vh, 2.5rem) * var(--proto-scale, 1)); font-weight: 800; margin-bottom: 16px; white-space: normal; line-height: 1.3; }
        .current-meta { display: flex; align-items: center; color: #0284c7; font-weight: 800; font-size: calc(clamp(0.75rem, 2.5vh, 2rem) * var(--proto-scale, 1)); text-transform: uppercase; }
        .current-title { font-size: calc(clamp(1.2rem, 7vh, 6rem) * var(--proto-scale, 1) * var(--proto-title-scale, 1)); font-weight: 900; line-height: 1.2; margin-top: 8px; word-wrap: break-word; }
        .current-time-box { font-size: calc(clamp(0.9rem, 4vh, 3.5rem) * var(--proto-scale, 1)); color: var(--pico-muted-color); margin-top: 4px; font-weight: 600; }
        .system-clock { background: var(--pico-card-background-color); padding: 2px 10px; border-radius: 20px; font-size: calc(clamp(0.7rem, 2.5vh, 2rem) * var(--proto-scale, 1)); font-weight: 700; color: #047857; border: 1.5px solid #059669; }

        .next-up-container { display: flex; align-items: center; gap: 8px; position: relative; z-index: 5; width: 100%; }
        .prev-btn { padding: 12px 14px; margin-bottom: 0; z-index: 10; font-size: calc(clamp(0.9rem, 3vh, 2rem) * var(--proto-scale, 1)); }
        @media (min-width: 769px) { .prev-btn { display: none !important; } }
        @media (max-width: 768px) and (orientation: landscape) { .prev-btn { display: none !important; } }
        
        .next-up-card { flex-grow: 1; min-width: 0; padding: 12px; border-radius: 8px; border-left: 5px solid #7e22ce !important; border: 1px solid var(--pico-muted-border-color); cursor: pointer; transition: all 0.3s ease; margin-bottom: 0; }
        .next-up-card.alert-active { background: var(--alert-bg) !important; border-color: var(--alert-border) !important; box-shadow: 0 0 12px rgba(249, 115, 22, 0.15) !important; animation: alertPulse 1.5s infinite ease-in-out; }
        .next-up-card.alert-active .next-label { color: var(--alert-lbl) !important; }
        .next-up-card.alert-active .next-title { color: var(--alert-txt) !important; }

        @keyframes alertPulse { 0% { transform: scale(1); } 50% { transform: scale(1.015); } 100% { transform: scale(1); } }
        .next-label { font-size: calc(clamp(0.7rem, 2.2vh, 1.8rem) * var(--proto-scale, 1) * var(--proto-nextup-scale, 1)); color: #7e22ce; font-weight: 800; text-transform: uppercase; }
        .next-title { font-size: calc(clamp(0.85rem, 3.5vh, 2.5rem) * var(--proto-scale, 1) * var(--proto-nextup-scale, 1)); font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; }

        .dynamic-content-area { position: relative; height: 100%; width: 100%; overflow: hidden; }
        .details-panel { position: absolute; top: 0; left: 0; width: calc(100% - 35px); height: 100%; display: flex; flex-direction: column; overflow: hidden; z-index: 1; }

        .tab-content-area { 
            position: absolute; top: 0; left: 0; width: calc(100% - 35px); height: 100%; 
            border-radius: 12px; border: 2px solid var(--pico-muted-border-color); 
            padding: 24px; overflow-y: auto; display: flex; flex-direction: column;
            transform: translateX(110%);
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: -4px 0 16px rgba(0,0,0,0.2);
        }
        .tab-content-area.dealt { transform: translateX(0); }

        .details-viewport { flex-grow: 1; overflow: hidden; position: relative; font-size: calc(clamp(0.95rem, 5vh, 4rem) * var(--proto-scale, 1) * var(--proto-details-scale, 1)); line-height: 1.5; }
        .details-page { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; transform: translateY(10px); transition: opacity 0.5s ease, transform 0.5s ease; }
        .details-page.active { opacity: 1; transform: translateY(0); }
        .details-viewport ul { padding-left: 1.5em; margin-top: 0.5em; }
        .details-viewport li { margin-bottom: 0.3em; }
        .details-viewport strong { font-weight: 800; }
        .details-viewport em { font-style: italic; }
        .tab-content-area .details-page { position: static !important; opacity: 1 !important; transform: none !important; }
        .tab-content-area h2 { font-size: calc(clamp(1.2rem, 6vh, 5rem) * var(--proto-scale, 1) * var(--proto-title-scale, 1)); margin-top: 0; margin-bottom: 12px; font-weight: 900; }

        .management-view { background: var(--pico-secondary-background); gap: 12px; display: grid; grid-template-columns: minmax(260px, 43%) 1fr; grid-template-rows: auto 1fr; position: relative; }
        .management-view article { margin-bottom: 0; padding: 12px 16px; display: flex; flex-direction: column; }

        /* Prototype: Optional Management View Continuity */
        body.proto-mgmt-continuity .management-view {
            grid-template-columns: minmax(260px, var(--proto-left-col, 35%)) 1fr;
        }
        body.proto-mgmt-continuity .management-view article {
            border-radius: 8px;
            border: 1px solid var(--pico-muted-border-color);
        }
        body.proto-mgmt-continuity .timeline-item {
            font-size: calc(clamp(0.8rem, 1.8vh, 1.4rem) * var(--proto-scale, 1));
            padding: 9px 16px 9px 12px;
        }
        .management-view label { font-size: clamp(0.75rem, 1.5vh, 1.2rem); font-weight: 700; margin-bottom: 0; }
        .management-view input, .management-view textarea { margin-bottom: 0; padding: 4px 8px; height: auto; font-size: clamp(0.8rem, 2vh, 1.5rem); }
        .management-view textarea { padding: 6px 8px; flex-grow: 1; min-height: 60px; resize: none; white-space: pre-wrap; }

        .timeline-container { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; }
        .timeline-box { flex-grow: 1; overflow: hidden; padding: 0 !important; min-height: 0; border: 1px solid var(--pico-muted-border-color); display: flex; flex-direction: column; }
        .timeline-header { padding: 10px 16px; background: var(--pico-table-row-stripped-background-color); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--pico-muted-border-color); flex-shrink: 0; }
        .timeline-header span { font-size: clamp(0.75rem, 1.5vh, 1.2rem); font-weight: 700; }
        .timeline-rows { flex-grow: 1; overflow-y: auto; min-height: 0; }
        .timeline-item { display: flex; align-items: center; padding: 8px 16px 8px 11px; border-left: 5px solid transparent; border-bottom: 1px solid var(--pico-muted-border-color); cursor: pointer; transition: background 0.2s; font-size: clamp(0.8rem, 1.8vh, 1.4rem); }
        .timeline-item:hover { background: var(--pico-primary-hover-background); }
        .timeline-item.active { background: var(--active-bg); color: var(--active-txt); border-left: 5px solid var(--active-border); font-weight: 700; }
        .item-time { width: 85px; font-weight: 700; color: #0284c7; flex-shrink: 0; }
        .item-status-col { width: 85px; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; flex-shrink: 0; }
        .item-text { flex-grow: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .control-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; flex-shrink: 0; justify-content: flex-end; }
        .control-bar [role="group"] { margin-bottom: 0; }
        .control-bar button { padding: 6px 12px; font-size: clamp(0.68rem, 1.5vh, 1.2rem); font-weight: 700; }

        .top-nav-row { display: flex; align-items: center; }
        .top-nav-row [role="group"] { margin-bottom: 0; }
        .top-nav-row button { padding: 4px 12px; font-size: clamp(0.68rem, 1.5vh, 1.2rem); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--btn-border) !important; }
        .top-nav-right { justify-content: flex-end; }
        
        .centered-button-group { display: flex !important; width: 100%; justify-content: center; flex-wrap: wrap; }
        @keyframes spin-emoji { 100% { transform: rotate(360deg); } }
        .spin-anim { display: inline-block; animation: spin-emoji 1s linear infinite; }

        .editor-column-wrapper { display: flex; flex-direction: column; min-height: 0; height: 100%; }
        .editor-article { flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; margin-bottom: 6px !important; }

        .timestamp-text { text-align: right; font-size: 0.75rem; font-weight: 600; padding-right: 2px; color: var(--ts-color); }
        .debug-link { color: inherit; text-decoration: none; opacity: 0.6; transition: opacity 0.2s; margin-left: 6px; }
        .debug-link:hover { opacity: 1; text-decoration: underline; }

        /* PORTRAIT SCALING LOCK (Reverts vh scaling back to safe readable limits on mobile portrait) */
        @media (orientation: portrait) {
            .presentation-view, .management-view { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
            .presentation-grid { display: flex; flex-direction: column; gap: 12px; height: 100%; }
            .status-panel { display: contents; }
            .status-panel::after { display: none; }
            .dynamic-content-area { order: 2; flex-grow: 1; min-height: 0; }
            .details-panel, .tab-content-area { width: 100% !important; padding-right: 25px; } 
            .next-up-container { order: 3; width: 98% !important; max-width: 98% !important; margin-top: auto; }
            .top-nav-row, .top-nav-right { justify-content: center; }
            .timeline-container { height: 45%; max-height: none; flex-shrink: 0; }
            .editor-column-wrapper { flex-grow: 1; min-height: 0; }
            .playback-toggle-btn { bottom: 10px; right: 10px; }
            
            /* Text Locks */
            .meeting-title-bar { font-size: calc(clamp(0.9rem, 3vw, 1.2rem) * var(--proto-scale, 1)); }
            .current-meta { font-size: calc(clamp(0.8rem, 2vw, 1rem) * var(--proto-scale, 1)); }
            .current-title { font-size: calc(clamp(1.8rem, 7vw, 2.5rem) * var(--proto-scale, 1) * var(--proto-title-scale, 1)); }
            .current-time-box { font-size: calc(clamp(1rem, 4vw, 1.4rem) * var(--proto-scale, 1)); }
            .system-clock { font-size: calc(clamp(0.75rem, 2vw, 0.9rem) * var(--proto-scale, 1)); }
            .next-label { font-size: calc(clamp(0.7rem, 2vw, 0.85rem) * var(--proto-scale, 1) * var(--proto-nextup-scale, 1)); }
            .next-title { font-size: calc(clamp(0.9rem, 3vw, 1.2rem) * var(--proto-scale, 1) * var(--proto-nextup-scale, 1)); }
            .details-viewport { font-size: calc(clamp(1.25rem, 5.2vw, 1.6rem) * var(--proto-scale, 1) * var(--proto-details-scale, 1)); }
            .tab-content-area h2 { font-size: calc(clamp(1.3rem, 6vw, 1.8rem) * var(--proto-scale, 1) * var(--proto-title-scale, 1)) !important; margin-bottom: 8px !important; }
            .vertical-tab { font-size: calc(1rem * var(--proto-scale, 1)); padding: 16px 8px; }
            .playback-toggle-btn { font-size: calc(0.9rem * var(--proto-scale, 1)); padding: 6px 14px; }
            .playback-playing { font-size: calc(1.5rem * var(--proto-scale, 1)); }
        }

        /* MOBILE LANDSCAPE SCALING LOCK (Reverts to safe vw bounds for short phone screens) */
        @media (max-height: 600px) and (orientation: landscape) {
            .meeting-title-bar { font-size: calc(clamp(0.85rem, 1.5vw, 1.1rem) * var(--proto-scale, 1)); margin-bottom: 12px; }
            .current-meta { font-size: calc(clamp(0.75rem, 1.5vw, 0.9rem) * var(--proto-scale, 1)); }
            .current-title { font-size: calc(clamp(1.2rem, 3vw, 2.2rem) * var(--proto-scale, 1) * var(--proto-title-scale, 1)); margin-top: 6px; }
            .current-time-box { font-size: calc(clamp(0.9rem, 1.8vw, 1.2rem) * var(--proto-scale, 1)); }
            .system-clock { font-size: calc(clamp(0.7rem, 1.2vw, 0.85rem) * var(--proto-scale, 1)); }
            .next-label { font-size: calc(clamp(0.7rem, 1.2vw, 0.8rem) * var(--proto-scale, 1) * var(--proto-nextup-scale, 1)); }
            .next-title { font-size: calc(clamp(0.85rem, 1.8vw, 1.1rem) * var(--proto-scale, 1) * var(--proto-nextup-scale, 1)); }
            .details-viewport { font-size: calc(clamp(1.1rem, 2.3vw, 1.45rem) * var(--proto-scale, 1) * var(--proto-details-scale, 1)); }
            .tab-content-area h2 { font-size: calc(clamp(1.2rem, 3vw, 1.8rem) * var(--proto-scale, 1) * var(--proto-title-scale, 1)); }
            .vertical-tab { font-size: calc(0.9rem * var(--proto-scale, 1)); padding: 16px 8px; }
            .playback-toggle-btn { font-size: calc(0.8rem * var(--proto-scale, 1)); padding: 4px 14px; }
            .playback-playing { font-size: calc(1.4rem * var(--proto-scale, 1)); }
        }
    </style>
</head>
<body x-data="meetingApp()" x-init="initApp()">

<div class="app-container">
    <div class="presentation-view" 
         @touchstart="handleTouchStart" 
         @touchmove="handleTouchMove" 
         @touchend="handleTouchEnd">
         
        <button class="playback-toggle-btn" 
                :class="isPlaying ? 'playback-playing' : 'contrast'" 
                @click.stop="togglePlayback()">
            <span x-text="isPlaying ? '⏸' : '▶ Resume'"></span>
        </button>

        <div class="swipe-overlay swipe-left" :class="{ 'swipe-ready': swipeDirection === 'prev' && swipeProgress >= 1 }" :style="`opacity: ${swipeDirection === 'prev' ? swipeProgress : 0}`">
            <div class="swipe-icon-wrapper" :style="`transform: translateX(${swipeDirection === 'prev' ? (swipeProgress * 15) : 0}px)`"><div class="swipe-icon">◀</div></div>
        </div>
        <div class="swipe-overlay swipe-right" :class="{ 'swipe-ready': swipeDirection === 'next' && swipeProgress >= 1 }" :style="`opacity: ${swipeDirection === 'next' ? swipeProgress : 0}`">
            <div class="swipe-icon-wrapper" :style="`transform: translateX(${swipeDirection === 'next' ? (-swipeProgress * 15) : 0}px)`"><div class="swipe-icon">▶</div></div>
        </div>

        <div class="tab-sidebar">
            <button class="vertical-tab" 
                    x-show="displaySequence.length > 1"
                    :class="{ 'active': activeTabId === null, 'bounce': isBouncing === 'agenda' }"
                    style="background-color: #475569;"
                    @click.stop="userClickedTab('agenda')">
                <div class="tab-progress" :style="`height: ${nextTabTarget === 'agenda' ? (displayTime / currentCycleDuration) * 100 : 0}%; transition: ${nextTabTarget === 'agenda' ? 'height 1s linear' : 'none'};`"></div>
                <span style="position:relative; z-index:2;">Agenda</span>
            </button>

            <template x-for="tab in tabs" :key="tab.id">
                <button class="vertical-tab" 
                        x-show="tab.enabled"
                        :class="{ 'active': activeTabId === tab.id, 'bounce': isBouncing === tab.id }"
                        :style="`background-color: ${tab.color};`"
                        @click.stop="userClickedTab(tab.id)">
                    <div class="tab-progress" :style="`height: ${nextTabTarget === tab.id ? (displayTime / currentCycleDuration) * 100 : 0}%; transition: ${nextTabTarget === tab.id ? 'height 1s linear' : 'none'};`"></div>
                    <span style="position:relative; z-index:2;" x-text="tab.title"></span>
                </button>
            </template>
        </div>

        <div class="presentation-grid">
            
            <header class="status-panel">
                <div> 
                    <div>
                        <h1 class="meeting-title-bar" x-show="meetingTitle" x-text="meetingTitle"></h1>
                    </div>
                    <div class="current-meta">
                        <span style="margin-right: 12px;">Now</span>
                        <span class="system-clock" x-text="sysClockText">--:--:-- --</span>
                    </div>
                    <div>
                        <div class="current-title" x-text="currentItem ? currentItem.title : 'No Active Agenda Item'"></div>
                        <div class="current-time-box" x-text="currentItem ? `Scheduled: ${currentItem.time}` : '--:--'"></div>
                    </div>
                </div>
                
                <nav class="next-up-container">
                    <button class="outline secondary prev-btn" @click.stop="shiftItem(-1)" title="Previous Topic">◀</button>
                    <article class="next-up-card" :class="{ 'alert-active': isAlertActive }" @click.stop="shiftItem(1)" title="Advance to Next Topic">
                        <div class="next-label">Next Up</div>
                        <div class="next-title">
                            <span x-text="nextItem ? nextItem.time : ''"></span>
                            <span x-text="nextItem ? ' - ' + nextItem.title : 'Adjournment / Session Closed'"></span>
                        </div>
                    </article>
                </nav>
            </header>
            
            <div class="dynamic-content-area">
                <section class="details-panel">
                    <div class="details-viewport" id="viewport">
                        <div class="details-page active" id="fallbackPage"><p>No item details loaded.</p></div>
                    </div>
                </section>

                <template x-for="tab in tabs" :key="tab.id">
                    <section class="tab-content-area"
                             :class="{ 'dealt': visibleTabs.includes(tab.id) }"
                             :style="`
                                 background-color: var(--pico-background-color);
                                 background-image: linear-gradient(${tab.color}1A, ${tab.color}1A);
                                 border-color: ${tab.color}40; 
                                 z-index: ${visibleTabs.indexOf(tab.id) === -1 ? 10 : 20 + visibleTabs.indexOf(tab.id)};
                             `">
                        <h2 :style="`color: ${tab.color};`" x-text="tab.title"></h2>
                        <div class="details-viewport" style="overflow-y: auto; overflow-x: hidden; position: relative;">
                             <div class="details-page active" x-html="parseMarkdown(tab.content)"></div>
                        </div>
                    </section>
                </template>
            </div>

        </div>
    </div>

    <div class="management-view">
        <nav class="top-nav-row">
            <div role="group" class="centered-button-group">
                <button class="secondary" @click="shareAgendaURL()">🔗 Share</button>
                <button class="secondary" @click="openImportModal()">📥 Import / Edit Raw</button>
            </div>
        </nav>

        <nav class="top-nav-row top-nav-right">
            <div role="group" class="centered-button-group">
                <button class="secondary" @click="toggleTheme()" x-text="isDark ? '☀️ Light' : '🌓 Dark'"></button>
                <button class="secondary" @click="toggleFullscreen()">📺 Full</button>
                <button class="secondary" @click="smartRefresh()" :disabled="isRefreshing">
                    <span :class="{'spin-anim': isRefreshing}">🔄</span> 
                    <span>Refresh</span>
                </button>
            </div>
        </nav>

        <div class="timeline-container">
            <article>
                <label>Meeting Title
                    <input type="text" x-model="meetingTitle" @change="updateTitle(); syncToURL()" placeholder="August 19, 2026">
                </label>
            </article>
            
            <article class="timeline-box">
                <div class="timeline-header">
                    <span>Elements & Agenda</span>
                    <button class="primary" style="padding: 4px 10px; margin-bottom: 0; font-size: clamp(0.7rem, 1.5vh, 1.2rem); line-height: 1.2;" x-show="!isPlaying" @click="resumeAuto()">Resume Auto</button>
                </div>
                <div class="timeline-rows">
                    <template x-for="tab in tabs" :key="'m_'+tab.id">
                        <div class="timeline-item" :class="{ 'active': editingMode === 'tab' && currentEditTabId === tab.id }" @click="selectEditTab(tab.id)">
                            <div class="item-status-col" :style="tab.enabled ? 'color: var(--pico-color);' : 'color: var(--pico-muted-color);'">
                                <span x-text="tab.enabled ? '🟢 On' : '⭕ Off'"></span>
                            </div>
                            <div class="item-text" :style="`color: ${tab.color}; opacity: ${tab.enabled ? 1 : 0.6};`" x-text="tab.title"></div>
                        </div>
                    </template>
                    
                    <div style="height: 1px; background: var(--pico-muted-border-color); margin: 4px 0;"></div>
                    
                    <template x-for="(item, idx) in agenda" :key="idx">
                        <div class="timeline-item" :class="{ 'active': editingMode === 'agenda' && idx === currentIndex }" @click="selectItem(idx)">
                            <div class="item-time" x-text="item.time"></div>
                            <div class="item-text" x-text="item.title"></div>
                        </div>
                    </template>
                </div>
            </article>
        </div>
        
        <div class="editor-column-wrapper">
            <article class="editor-article">
                <div class="grid">
                    <label x-show="editingMode === 'agenda'">Time 
                        <input type="text" x-model="editTime" placeholder="10:45 AM">
                    </label>
                    <label x-show="editingMode === 'tab'">Display Status
                        <div style="padding-top: 8px;">
                            <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 0; cursor: pointer;">
                                <input type="checkbox" x-model="editEnabled" style="margin-bottom: 0;"> Enabled in Rotation
                            </label>
                        </div>
                    </label>
                    
                    <label>Title 
                        <input type="text" x-model="editTitle" placeholder="Topic or Tab Title">
                    </label>
                </div>
                <label style="flex-grow:1; display:flex; flex-direction:column; min-height:0;">Detail Content
                    <textarea x-model="editDetails" placeholder="Overview details... Use - for lists, -- for sub-lists, **bold** and *italics*"></textarea>
                </label>
                
                <nav class="control-bar" style="margin-top: 10px;">
                    <div role="group">
                        <button class="secondary" :disabled="!canUndo" @click="undoLastAction()">↩ Undo</button>
                        <button class="secondary outline" x-show="editingMode === 'agenda'" @click="deleteCurrentItem()">Delete</button>
                        <button class="primary" @click="saveEditorValues()">Save</button>
                        <button class="contrast" x-show="editingMode === 'agenda'" @click="addNewItemBelow()">+ Add</button>
                    </div>
                </nav>
            </article>
            
            <div class="timestamp-text" style="padding-top: 4px;">
                <span x-show="lastUpdatedText">Updated: <span x-text="lastUpdatedText"></span> &bull; </span>
                <a href="#" class="debug-link" @click.prevent="$refs.debugModal.showModal()">⚙️ Debug</a>
            </div>
        </div>
    </div>
</div>

<dialog x-ref="importModal">
    <article style="max-width: 800px;">
        <h3>Bulk Import / Edit Raw</h3>
        <p>Edit the full raw text of the agenda and tabs below:</p>
        <textarea x-model="importText" style="height: 40vh; min-height: 200px;" placeholder="..."></textarea>
        <footer>
            <button class="secondary" @click="$refs.importModal.close()">Cancel</button>
            <button class="primary" @click="processImportText(); $refs.importModal.close()">Save to Agenda</button>
        </footer>
    </article>
</dialog>

<dialog x-ref="debugModal">
    <article style="max-width: 520px; max-height: 90vh; overflow-y: auto;">
        <header style="margin-bottom: 12px;"><strong>Developer Debug & Prototyping</strong></header>
        
        <details open style="margin-bottom: 12px; border: 1px solid var(--pico-muted-border-color); padding: 10px; border-radius: 8px;">
            <summary style="font-weight: 700; cursor: pointer;">🎨 Sizing & Layout Prototyper</summary>
            <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 10px;">
                <label style="font-size: 0.8rem; font-weight: 700; margin-bottom: 0;">Preset Profile
                    <select x-model="protoPreset" @change="selectProtoPreset($event.target.value)" style="margin-top: 4px; font-size: 0.85rem; padding: 4px 8px;">
                        <option value="baseline">Preset A: Baseline (Current Production)</option>
                        <option value="harmonic">Preset B: Harmonic Proportional</option>
                        <option value="projector">Preset C: Projector Boost (High Legibility)</option>
                        <option value="compact">Preset D: Compact / Wide Details</option>
                        <option value="custom" disabled>Custom (Adjusted via sliders below)</option>
                    </select>
                </label>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <label style="font-size: 0.75rem; margin-bottom: 0;">Global Scale: <strong x-text="protoScale + '%'"></strong>
                        <input type="range" min="80" max="135" step="1" x-model.number="protoScale" @input="protoPreset = 'custom'; applyProtoStyles()">
                    </label>
                    <label style="font-size: 0.75rem; margin-bottom: 0;">Left Col Width: <strong x-text="protoLeftCol + '%'"></strong>
                        <input type="range" min="25" max="45" step="1" x-model.number="protoLeftCol" @input="protoPreset = 'custom'; applyProtoStyles()">
                    </label>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <label style="font-size: 0.75rem; margin-bottom: 0;">Heading Scale: <strong x-text="protoTitleScale + '%'"></strong>
                        <input type="range" min="80" max="135" step="1" x-model.number="protoTitleScale" @input="protoPreset = 'custom'; applyProtoStyles()">
                    </label>
                    <label style="font-size: 0.75rem; margin-bottom: 0;">Details Text: <strong x-text="protoDetailsScale + '%'"></strong>
                        <input type="range" min="80" max="135" step="1" x-model.number="protoDetailsScale" @input="protoPreset = 'custom'; applyProtoStyles()">
                    </label>
                </div>

                <label style="font-size: 0.75rem; margin-bottom: 0;">Next Up Card Scale: <strong x-text="protoNextUpScale + '%'"></strong>
                    <input type="range" min="80" max="135" step="1" x-model.number="protoNextUpScale" @input="protoPreset = 'custom'; applyProtoStyles()">
                </label>

                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.8rem; margin-top: 4px;">
                    <input type="checkbox" x-model="protoMgmtContinuity" @change="applyProtoStyles()" style="margin-bottom: 0;">
                    <span>Management View Continuity Improvements</span>
                </label>

                <div style="display: flex; gap: 8px; margin-top: 6px;">
                    <button type="button" class="secondary outline" style="flex: 1; padding: 4px 8px; font-size: 0.75rem;" @click="resetProtoToBaseline()">Reset Baseline</button>
                    <button type="button" class="contrast outline" style="flex: 1; padding: 4px 8px; font-size: 0.75rem;" @click="copyProtoSettings()">📋 Copy Config</button>
                </div>
            </div>
        </details>

        <fieldset>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" x-model="isFastMode" @change="displayTime = 0"> 
                Fast Cycle Simulation
            </label>
        </fieldset>
        
        <fieldset style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--pico-muted-border-color);">
            <label>Screen Wake Lock API: <br>
                <strong x-text="wakeLockStatus" style="color: #0284c7;"></strong>
            </label>
        </fieldset>

        <fieldset style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--pico-muted-border-color);">
            <button class="outline" style="width: 100%; color: #dc2626; border-color: #dc2626; font-size: 0.8rem; padding: 6px;" @click="clearAllStorage()">
                ⚠️ Clear All Local Storage
            </button>
        </fieldset>

        <footer style="margin-top: 12px;">
            <button class="primary" style="margin-bottom: 0; padding: 6px 16px;" @click="$refs.debugModal.close()">Close</button>
        </footer>
    </article>
</dialog>

<script>
function meetingApp() {
    return {
        meetingTitle: '', agenda: [], currentIndex: 0, isAlertActive: false,
        isDark: false, sysClockText: '--:--:-- --', lastCheckedMilestoneTime: '', historyStack: [],
        editTime: '', editTitle: '', editDetails: '', editEnabled: true, importText: '', lastUpdatedText: '', isRefreshing: false,

        touchStartX: 0, touchStartY: 0, isSwiping: false, swipeDirection: null, swipeProgress: 0, touchLocked: false, axisDetermined: false,
        
        wakeLockSentinel: null,
        wakeLockStatus: 'Not Requested',

        tabs: [
            { id: 'patrols', title: 'Patrols', content: '', enabled: true, color: '#16a34a' },
            { id: 'dates', title: 'Dates', content: '', enabled: true, color: '#2563eb' },
            { id: 'announcements', title: 'Announcements', content: '', enabled: true, color: '#ea580c' } 
        ],
        activeTabId: null, 
        visibleTabs: [], 
        
        displaySequence: ['agenda'], displayIndex: 0, displayTime: 0, 
        isPlaying: false, isBouncing: null, isFastMode: false, 
        
        editingMode: 'agenda', 
        currentEditTabId: null, 

        /* Prototyping State */
        protoPreset: 'baseline',
        protoScale: 100,
        protoLeftCol: 35,
        protoTitleScale: 100,
        protoDetailsScale: 100,
        protoNextUpScale: 100,
        protoMgmtContinuity: false,

        applyProtoStyles() {
            const root = document.documentElement;
            root.style.setProperty('--proto-scale', this.protoScale / 100);
            root.style.setProperty('--proto-left-col', `${this.protoLeftCol}%`);
            root.style.setProperty('--proto-title-scale', this.protoTitleScale / 100);
            root.style.setProperty('--proto-details-scale', this.protoDetailsScale / 100);
            root.style.setProperty('--proto-nextup-scale', this.protoNextUpScale / 100);
            document.body.classList.toggle('proto-mgmt-continuity', !!this.protoMgmtContinuity);
            
            try {
                sessionStorage.setItem('boardProtoSettings', JSON.stringify({
                    preset: this.protoPreset,
                    scale: this.protoScale,
                    leftCol: this.protoLeftCol,
                    titleScale: this.protoTitleScale,
                    detailsScale: this.protoDetailsScale,
                    nextUpScale: this.protoNextUpScale,
                    mgmtContinuity: this.protoMgmtContinuity
                }));
            } catch(e) {}
            this.renderPresentationTextPages();
        },

        selectProtoPreset(preset) {
            this.protoPreset = preset;
            if (preset === 'baseline') {
                this.protoScale = 100;
                this.protoLeftCol = 35;
                this.protoTitleScale = 100;
                this.protoDetailsScale = 100;
                this.protoNextUpScale = 100;
                this.protoMgmtContinuity = false;
            } else if (preset === 'harmonic') {
                this.protoScale = 105;
                this.protoLeftCol = 33;
                this.protoTitleScale = 95;
                this.protoDetailsScale = 110;
                this.protoNextUpScale = 95;
                this.protoMgmtContinuity = true;
            } else if (preset === 'projector') {
                this.protoScale = 115;
                this.protoLeftCol = 36;
                this.protoTitleScale = 110;
                this.protoDetailsScale = 115;
                this.protoNextUpScale = 105;
                this.protoMgmtContinuity = false;
            } else if (preset === 'compact') {
                this.protoScale = 95;
                this.protoLeftCol = 30;
                this.protoTitleScale = 90;
                this.protoDetailsScale = 100;
                this.protoNextUpScale = 90;
                this.protoMgmtContinuity = true;
            }
            this.applyProtoStyles();
        },

        resetProtoToBaseline() {
            sessionStorage.removeItem('boardProtoSettings');
            this.selectProtoPreset('baseline');
        },

        copyProtoSettings() {
            const summary = JSON.stringify({
                preset: this.protoPreset,
                scale: `${this.protoScale}%`,
                leftCol: `${this.protoLeftCol}%`,
                titleScale: `${this.protoTitleScale}%`,
                detailsScale: `${this.protoDetailsScale}%`,
                nextUpScale: `${this.protoNextUpScale}%`,
                mgmtContinuity: this.protoMgmtContinuity
            }, null, 2);
            navigator.clipboard.writeText(summary).then(() => {
                alert("Prototype settings copied to clipboard!\n\n" + summary);
            }).catch(() => alert("Settings:\n" + summary));
        },

        get currentItem() { return this.agenda[this.currentIndex] || null; },
        get nextItem() { return this.agenda[this.currentIndex + 1] || null; },
        get canUndo() { return this.historyStack.length > 0; },
        
        get nextTabTarget() { return this.displaySequence.length > 1 ? this.displaySequence[(this.displayIndex + 1) % this.displaySequence.length] : null; },
        
        get currentCycleDuration() { 
            return this.isFastMode ? APP_CONFIG.timing.debugDuration : (this.activeTabId === null ? APP_CONFIG.timing.agendaDuration : APP_CONFIG.timing.cardDuration); 
        },

        async initApp() {
            this.isDark = (localStorage.getItem(APP_CONFIG.storage.themeKey) || APP_CONFIG.appearance.defaultTheme) === 'dark';
            document.documentElement.setAttribute('data-theme', this.isDark ? 'dark' : 'light');
            
            // Restore prototype settings if saved in current session
            try {
                const savedProto = sessionStorage.getItem('boardProtoSettings');
                if (savedProto) {
                    const p = JSON.parse(savedProto);
                    this.protoPreset = p.preset || 'custom';
                    this.protoScale = p.scale ?? 100;
                    this.protoLeftCol = p.leftCol ?? 35;
                    this.protoTitleScale = p.titleScale ?? 100;
                    this.protoDetailsScale = p.detailsScale ?? 100;
                    this.protoNextUpScale = p.nextUpScale ?? 100;
                    this.protoMgmtContinuity = !!p.mgmtContinuity;
                    this.applyProtoStyles();
                }
            } catch(e) {}

            this.agenda = await this.loadInitialAgenda();
            this.buildDisplaySequence();
            this.syncToURL();
            
            const modDate = new Date(document.lastModified);
            if (!isNaN(modDate) && modDate.getFullYear() > 1970) this.lastUpdatedText = modDate.toLocaleString();

            this.evaluateAutomatedTimeTrigger(this.getTimeString());
            this.syncEditorInputs();
            
            // Staggered layout updates to combat Android PWA launch rendering race condition
            setTimeout(setViewportHeight, 100);
            setTimeout(() => { setViewportHeight(); this.renderPresentationTextPages(); }, 300);
            setTimeout(() => { setViewportHeight(); this.renderPresentationTextPages(); }, 800);
            
            // Always attempts to re-acquire when returning to browser so paused state remains awake
            document.addEventListener('visibilitychange', async () => {
                if (document.visibilityState === 'visible') {
                    await this.requestWakeLock();
                }
            });

            // Keyboard navigation listener (Left/Right arrows for Prev/Next)
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === 'ArrowRight') this.shiftItem(1);
                else if (e.key === 'ArrowLeft') this.shiftItem(-1);
            });

            setInterval(() => this.updateSystemClock(), 1000);
            setInterval(() => this.runDisplayLoop(), 1000); 
            window.addEventListener('resize', () => {
                setTimeout(() => this.renderPresentationTextPages(), 150);
            });
        },
        
        async requestWakeLock() {
            if ('wakeLock' in navigator) {
                if (this.wakeLockSentinel) return; // Already active
                try {
                    this.wakeLockSentinel = await navigator.wakeLock.request('screen');
                    this.wakeLockStatus = 'Active 🟢';
                    
                    this.wakeLockSentinel.addEventListener('release', () => { 
                        this.wakeLockSentinel = null; 
                        this.wakeLockStatus = 'Released ⭕';
                    });
                } catch (e) {
                    this.wakeLockStatus = `Failed ❌ (${e.name})`;
                }
            } else {
                this.wakeLockStatus = 'Unsupported by Browser ⚠️';
            }
        },

        getScheduledAgendaIndex() {
            let matched = 0; 
            const currentMins = this.parseToMinutes(this.getTimeString(new Date(), false));
            this.agenda.forEach((item, i) => { if (this.parseToMinutes(item.time) <= currentMins) matched = i; });
            return matched;
        },

        buildDisplaySequence() {
            let seq = ['agenda'];
            if(this.tabs[0].enabled) seq.push('patrols');
            if(this.tabs[1].enabled) seq.push('dates');
            if(this.tabs[2].enabled) seq.push('announcements');
            this.displaySequence = seq;
            if(this.displayIndex >= this.displaySequence.length) this.displayIndex = 0;
        },

        togglePlayback() {
            if (this.isPlaying) {
                this.isPlaying = false;
            } else {
                this.resumeAuto();
            }
            this.requestWakeLock(); // Grabs lock if button pressed directly upon load
        },

        resumeAuto() {
            this.isPlaying = true;
            this.displayTime = 0;
            this.isAlertActive = false;
            
            let matched = this.getScheduledAgendaIndex();
            if (this.currentIndex !== matched) {
                this.currentIndex = matched;
                this.syncEditorInputs();
                this.renderPresentationTextPages();
            }
            
            this.switchTabTo(null); // Ensure side cards drop when playing the scheduled topic
            this.requestWakeLock();
        },

        userInteracted() {
            this.isPlaying = false;
            this.displayTime = 0;
            this.requestWakeLock(); 
        },

        switchTabTo(targetId) {
            this.activeTabId = targetId;
            if (targetId === null) {
                this.visibleTabs = [];
            } else {
                if (!this.visibleTabs.includes(targetId)) {
                    this.visibleTabs.push(targetId);
                } else {
                    this.visibleTabs = this.visibleTabs.filter(id => id !== targetId);
                    this.visibleTabs.push(targetId);
                }
            }
        },

        userClickedTab(id) {
            let targetId = (id === 'agenda' || this.activeTabId === id) ? null : id;
            this.switchTabTo(targetId);
            
            if (targetId === null) {
                if (this.currentIndex === this.getScheduledAgendaIndex()) {
                    this.resumeAuto(); // Tab dropped back to currently scheduled item -> Resume Auto
                } else {
                    this.isPlaying = false;
                    this.requestWakeLock();
                }
            } else {
                this.isPlaying = false; // Custom tab selected -> Pause and lock
                this.requestWakeLock();
            }
            
            let idx = this.displaySequence.indexOf(targetId === null ? 'agenda' : targetId);
            if (idx !== -1) this.displayIndex = idx;
        },

        runDisplayLoop() {
            if (!this.isPlaying || this.displaySequence.length <= 1) return; 

            this.displayTime++;
            
            if (this.displayTime === (this.currentCycleDuration - APP_CONFIG.timing.bounceLeadTime)) {
                let nextMode = this.displaySequence[(this.displayIndex + 1) % this.displaySequence.length];
                this.isBouncing = nextMode;
                setTimeout(() => this.isBouncing = null, 850);
            }

            if (this.displayTime >= this.currentCycleDuration) {
                this.displayTime = 0;
                this.displayIndex = (this.displayIndex + 1) % this.displaySequence.length;
                let target = this.displaySequence[this.displayIndex];
                let targetId = target === 'agenda' ? null : target;
                this.switchTabTo(targetId);
            }
        },

        handleTouchStart(e) {
            if (e.target.closest('.playback-toggle-btn') || e.target.closest('.vertical-tab')) return;
            this.touchStartX = e.touches[0].clientX;
            this.touchStartY = e.touches[0].clientY;
            this.isSwiping = false; this.swipeDirection = null; this.swipeProgress = 0; 
            this.touchLocked = false; this.axisDetermined = false;
        },
        
        handleTouchMove(e) {
            if (this.touchLocked) return;
            const deltaX = e.touches[0].clientX - this.touchStartX;
            const deltaY = e.touches[0].clientY - this.touchStartY;

            if (!this.axisDetermined) {
                if (Math.abs(deltaX) < 10 && Math.abs(deltaY) < 10) return;
                this.axisDetermined = true;
                if (Math.abs(deltaY) > Math.abs(deltaX)) { this.touchLocked = true; return; } 
                else { this.isSwiping = true; }
            }

            if (this.isSwiping) {
                if (e.cancelable) e.preventDefault();
                if (Math.abs(deltaX) > APP_CONFIG.swipe.deadzone) {
                    this.swipeDirection = deltaX > 0 ? 'prev' : 'next';
                    const rawProgress = (Math.abs(deltaX) - APP_CONFIG.swipe.deadzone) / APP_CONFIG.swipe.dragDistance;
                    this.swipeProgress = Math.max(0, Math.min(rawProgress, 1)); 
                } else {
                    this.swipeProgress = 0;
                }
            }
        },
        
        handleTouchEnd(e) {
            if (this.isSwiping && this.swipeProgress >= 1) {
                if (this.swipeDirection === 'prev') this.shiftItem(-1);
                else if (this.swipeDirection === 'next') this.shiftItem(1);
            }
            this.isSwiping = false; this.swipeProgress = 0; this.swipeDirection = null; 
            this.touchLocked = false; this.axisDetermined = false;
        },

        async syncToURL() {
            try {
                const minified = { 
                    m: this.meetingTitle, 
                    items: this.agenda.map(item => ([ item.time, item.title, item.details ])),
                    t: this.tabs.map(tab => ([ tab.enabled ? 1 : 0, tab.content, tab.title ]))
                };
                const stream = new Blob([JSON.stringify(minified)]).stream().pipeThrough(new CompressionStream('deflate-raw'));
                const buffer = await new Response(stream).arrayBuffer(); let binary = ''; new Uint8Array(buffer).forEach(b => binary += String.fromCharCode(b));
                const hash = '#agenda=' + btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                if (window.location.hash !== hash) history.replaceState(null, '', hash);
                localStorage.setItem(APP_CONFIG.storage.tabsKey, JSON.stringify(this.tabs));
            } catch (e) {}
        },

        shareAgendaURL() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert(`Live Share Link copied! (${url.length} chars)`);
            }).catch(() => alert("Failed to copy link."));
        },

        openImportModal() {
            this.importText = this.generateImportText();
            this.$refs.importModal.showModal();
        },

        generateImportText() {
            let text = `${this.meetingTitle}\n\n`;
            this.agenda.forEach(item => {
                text += `${item.time} ${item.title}\n`;
                if (item.details) text += `${item.details}\n`;
                text += `\n`;
            });
            text += `=== TABS ===\n`;
            this.tabs.forEach(tab => {
                text += `# ${tab.title} [${tab.enabled ? 'x' : ' '}]\n`;
                if (tab.content) text += `${tab.content}\n`;
                text += `\n`;
            });
            return text.trim();
        },

        parseMarkdown(text) {
            if (!text) return '';
            let parsed = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>');
            let lines = parsed.split('\n'), html = '', inList = false;
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) { if (inList) { html += '</ul>'; inList = false; } continue; }
                if (line.startsWith('-- ')) {
                    if (!inList) { html += '<ul>'; inList = true; }
                    html += `<li class="sub-item" style="margin-left: 1.5em; list-style-type: circle;">${line.substring(3)}</li>`;
                } else if (line.startsWith('- ')) {
                    if (!inList) { html += '<ul>'; inList = true; }
                    html += `<li>${line.substring(2)}</li>`;
                } else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<p>${line}</p>`;
                }
            }
            if (inList) html += '</ul>';
            return html;
        },

        async smartRefresh() {
            if (this.isRefreshing) return;
            this.isRefreshing = true;
            const currentMod = new Date(document.lastModified).getTime();
            const startTime = Date.now();
            const checkUpdate = async () => {
                if (Date.now() - startTime > APP_CONFIG.timing.refreshTimeout) return this.isRefreshing = false; 
                try {
                    const res = await fetch(window.location.href.split('#')[0] + (window.location.href.includes('?') ? '&' : '?') + 'cb=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
                    if (res.headers.get('Last-Modified') && new Date(res.headers.get('Last-Modified')).getTime() > currentMod) return window.location.reload(true);
                } catch(e) {}
                setTimeout(checkUpdate, 5000);
            };
            checkUpdate();
        },

        toggleTheme() {
            this.isDark = !this.isDark;
            localStorage.setItem(APP_CONFIG.storage.themeKey, this.isDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', this.isDark ? 'dark' : 'light');
        },
        
        toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}. (Note: iOS does not support true fullscreen in the browser, please use 'Add to Home Screen' via the share menu instead.)`);
                });
            } else {
                document.exitFullscreen();
            }
        },

        getTimeString(d = new Date(), s = false) {
            let h = d.getHours(), m = d.getMinutes().toString().padStart(2, '0');
            return `${(h % 12 || 12).toString().padStart(2, '0')}:${m}${s ? ':' + d.getSeconds().toString().padStart(2, '0') : ''} ${h >= 12 ? 'PM' : 'AM'}`;
        },
        updateSystemClock() {
            this.sysClockText = this.getTimeString(new Date(), true);
            const check = this.getTimeString(new Date(), false);
            if (check !== this.lastCheckedMilestoneTime) this.evaluateAutomatedTimeTrigger(check);
        },
        parseToMinutes(ts) {
            let m = ts.match(/(\d+):(\d+)\s*(AM|PM)/i);
            return m ? (m[1] % 12 + (/PM/i.test(m[3]) ? 12 : 0)) * 60 + +m[2] : 0;
        },

        evaluateAutomatedTimeTrigger(currentWallTime) {
            let matched = this.getScheduledAgendaIndex();

            if (this.isPlaying && matched !== this.currentIndex) {
                this.lastCheckedMilestoneTime = currentWallTime; 
                this.currentIndex = matched; 
                this.isAlertActive = false;
                this.syncEditorInputs(); 
                this.renderPresentationTextPages();
            }
        },

        shiftItem(dir) {
            if (dir < 0 && this.currentIndex === 0) { this.isAlertActive = !this.isAlertActive; return; }
            const target = this.currentIndex + dir;
            if (target >= 0 && target < this.agenda.length) { 
                this.currentIndex = target; 
                this.isAlertActive = false; 
                this.editingMode = 'agenda';
                this.switchTabTo(null);
                this.syncEditorInputs(); 
                this.renderPresentationTextPages(); 
                
                if (this.currentIndex === this.getScheduledAgendaIndex()) {
                    this.resumeAuto(); // Swiped back to schedule -> Resume Auto
                } else {
                    this.isPlaying = false; // Poked off schedule -> Pause
                    this.requestWakeLock();
                }
            }
        },
        
        selectItem(idx) { 
            this.editingMode = 'agenda';
            this.currentIndex = idx; 
            this.isAlertActive = false; 
            this.switchTabTo(null);
            this.syncEditorInputs(); 
            this.renderPresentationTextPages(); 
            
            if (this.currentIndex === this.getScheduledAgendaIndex()) {
                this.resumeAuto(); // Jumped back to schedule -> Resume Auto
            } else {
                this.isPlaying = false; // Jumped off schedule -> Pause
                this.requestWakeLock();
            }
        },

        selectEditTab(id) {
            this.editingMode = 'tab';
            this.currentEditTabId = id;
            this.syncEditorInputs();
        },

        updateTitle() { document.title = this.meetingTitle ? `Meeting - ${this.meetingTitle}` : "Meeting"; localStorage.setItem(APP_CONFIG.storage.titleKey, this.meetingTitle); },
        
        syncEditorInputs() {
            if (this.editingMode === 'agenda') {
                if (this.currentItem) { this.editTime = this.currentItem.time; this.editTitle = this.currentItem.title; this.editDetails = this.currentItem.details; }
                else { this.editTime = ""; this.editTitle = ""; this.editDetails = ""; }
            } else if (this.editingMode === 'tab') {
                const tab = this.tabs.find(t => t.id === this.currentEditTabId);
                if (tab) {
                    this.editEnabled = tab.enabled;
                    this.editTitle = tab.title;
                    this.editDetails = tab.content;
                }
            }
        },
        
        pushHistoryState() { 
            this.historyStack.push({ 
                agenda: JSON.parse(JSON.stringify(this.agenda)), 
                tabs: JSON.parse(JSON.stringify(this.tabs)),
                currentIndex: this.currentIndex,
                editingMode: this.editingMode,
                currentEditTabId: this.currentEditTabId
            }); 
            if (this.historyStack.length > APP_CONFIG.history.maxItems) this.historyStack.shift(); 
        },
        
        undoLastAction() {
            if (!this.canUndo) return; 
            const prev = this.historyStack.pop();
            this.agenda = prev.agenda; 
            this.tabs = prev.tabs;
            this.currentIndex = prev.currentIndex;
            this.editingMode = prev.editingMode;
            this.currentEditTabId = prev.currentEditTabId;
            
            this.buildDisplaySequence();
            localStorage.setItem(APP_CONFIG.storage.agendaKey, JSON.stringify(this.agenda)); 
            localStorage.setItem(APP_CONFIG.storage.tabsKey, JSON.stringify(this.tabs));
            this.syncEditorInputs(); 
            this.renderPresentationTextPages(); 
            this.syncToURL();
        },
        
        saveEditorValues() {
            if (!this.editTitle.trim()) return alert("A title is required.");
            
            this.pushHistoryState();

            if (this.editingMode === 'agenda') {
                if (!this.editTime.trim()) return alert("A time is required for agenda items.");
                const payload = { time: this.editTime.trim(), title: this.editTitle.trim(), details: this.editDetails.trim() };
                if (this.agenda[this.currentIndex]) this.agenda[this.currentIndex] = payload;
                else { this.agenda.push(payload); this.currentIndex = this.agenda.length - 1; }
                this.agenda.sort((a, b) => this.parseToMinutes(a.time) - this.parseToMinutes(b.time));
                localStorage.setItem(APP_CONFIG.storage.agendaKey, JSON.stringify(this.agenda)); 
                this.renderPresentationTextPages(); 
            } else if (this.editingMode === 'tab') {
                const tab = this.tabs.find(t => t.id === this.currentEditTabId);
                if (tab) {
                    tab.enabled = this.editEnabled;
                    tab.title = this.editTitle.trim() || tab.title;
                    tab.content = this.editDetails.trim();
                }
                this.buildDisplaySequence();
                localStorage.setItem(APP_CONFIG.storage.tabsKey, JSON.stringify(this.tabs));
            }
            this.syncToURL();
        },
        
        addNewItemBelow() {
            if (this.editingMode !== 'agenda') return;
            this.pushHistoryState();
            this.currentIndex++;
            this.agenda.splice(this.currentIndex, 0, { time: this.editTime.trim() || "12:00 PM", title: this.editTitle.trim() || "New Topic", details: this.editDetails.trim() || "" });
            this.agenda.sort((a, b) => this.parseToMinutes(a.time) - this.parseToMinutes(b.time));
            localStorage.setItem(APP_CONFIG.storage.agendaKey, JSON.stringify(this.agenda)); this.syncEditorInputs(); this.renderPresentationTextPages(); this.syncToURL();
        },
        
        deleteCurrentItem() {
            if (this.editingMode !== 'agenda') return;
            if (this.agenda.length <= 1) return alert("At least one agenda topic is required.");
            this.pushHistoryState(); this.agenda.splice(this.currentIndex, 1);
            this.currentIndex = Math.max(0, this.currentIndex - 1);
            localStorage.setItem(APP_CONFIG.storage.agendaKey, JSON.stringify(this.agenda)); this.syncEditorInputs(); this.renderPresentationTextPages(); this.syncToURL();
        },

        renderPresentationTextPages() {
            const c = document.getElementById('viewport'); if (!c) return;
            clearInterval(window.carouselInterval); c.innerHTML = "";
            if (!this.agenda.length || !this.currentItem) return c.innerHTML = '<div class="details-page active"><p>No item details loaded.</p></div>';

            const compStyle = window.getComputedStyle(c);
            const t = document.createElement('div');
            t.style.cssText = `width:${c.clientWidth}px;position:absolute;visibility:hidden;font-size:${compStyle.fontSize};line-height:${compStyle.lineHeight};font-family:${compStyle.fontFamily};`;
            
            t.innerHTML = this.parseMarkdown(this.currentItem.details); 
            document.body.appendChild(t);

            let p = [], h = "", ch = 0; const mh = c.clientHeight - 20;
            [...t.childNodes].forEach(n => {
                const b = document.createElement('div'); b.style.cssText = t.style.cssText; b.appendChild(n.cloneNode(true)); document.body.appendChild(b);
                const nh = b.clientHeight; document.body.removeChild(b);
                if (ch + nh > mh && h) { p.push(h); h = ""; ch = 0; }
                h += n.nodeType === 3 ? n.textContent : n.outerHTML; ch += nh;
            });
            if (h) p.push(h); document.body.removeChild(t);

            p.forEach((ht, i) => {
                const d = document.createElement('div'); d.className = `details-page ${i === 0 ? 'active' : ''}`;
                d.innerHTML = ht; c.appendChild(d);
            });

            if (p.length > 1) {
                let a = 0; window.carouselInterval = setInterval(() => {
                    const pgs = c.querySelectorAll('.details-page'); if (!pgs.length) return;
                    pgs[a].classList.remove('active'); a = (a + 1) % pgs.length; pgs[a].classList.add('active');
                }, APP_CONFIG.timing.carouselInterval);
            }
        },

        async loadInitialAgenda() {
            this.meetingTitle = localStorage.getItem(APP_CONFIG.storage.titleKey) || "August 19, 2026"; this.updateTitle();
            if (window.location.hash.startsWith('#agenda=')) {
                try {
                    let base64 = window.location.hash.replace('#agenda=', '').replace(/-/g, '+').replace(/_/g, '/');
                    while (base64.length % 4) base64 += '=';
                    const binary = atob(base64); const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
                    const minified = JSON.parse(await new Response(stream).text());
                    if (minified.m !== undefined) { this.meetingTitle = minified.m; this.updateTitle(); }
                    
                    if (minified.t && Array.isArray(minified.t)) {
                        minified.t.forEach((tData, i) => {
                            if (this.tabs[i]) { 
                                this.tabs[i].enabled = !!tData[0]; 
                                this.tabs[i].content = tData[1] || ''; 
                                if (tData[2]) this.tabs[i].title = tData[2];
                            }
                        });
                    }
                    
                    const decoded = (minified.items || minified).map(item => ({ time: item[0], title: item[1], details: item[2] }));
                    if (Array.isArray(decoded) && decoded.length) { localStorage.setItem(APP_CONFIG.storage.agendaKey, JSON.stringify(decoded)); return decoded; }
                } catch (e) {}
            }
            const stored = localStorage.getItem(APP_CONFIG.storage.agendaKey);
            const storedTabs = localStorage.getItem(APP_CONFIG.storage.tabsKey);
            if (storedTabs) { try { this.tabs = JSON.parse(storedTabs); } catch(e){} }
            if (stored) { try { return JSON.parse(stored); } catch (e) {} }
            return [{"time":"10:35 AM","title":"Call to Order & Roll Call","details":"Initial meeting protocols and legal establishment of the board quorum:\n- Approval of previous executive session minutes.\n- Introduction of community observers and external stakeholders."},{"time":"10:45 AM","title":"Quarterly Financial Overview","details":"Granular structural inspection of administrative balances across localized programs:\n- Review of paperless utility updates and water infrastructure accounts.\n- Evaluation of capital allocations targeting regional youth programs."},{"time":"11:15 AM","title":"Facility Safety & Compliance","details":"Ensuring full technical alignment with municipal regulatory framework criteria:\n- Verification of structural audit pipelines for regional asset installations.\n- Updates on background check procedures and safety clearances."}];
        },

        processImportText() {
            if (!this.importText.trim() || !confirm("Warning: Importing text will replace all existing agenda items. Continue?")) return;
            
            const parts = this.importText.split(/===\s*TABS\s*===/i);
            const agendaPart = parts[0].trim();
            const tabsPart = parts.length > 1 ? parts[1].trim() : '';

            const timePattern = /^(\d{1,2}:\d{2}\s*(?:AM|PM|am|pm)?)\s*[-:]?\s*(.*)$/i; const newAgenda = []; let currentItem = null, titleFound = false;
            agendaPart.split('\n').forEach(line => {
                const trimmed = line.trim(); if (!trimmed) return;
                if (!titleFound && !newAgenda.length && !currentItem && !timePattern.test(trimmed)) { this.meetingTitle = trimmed.replace(/^(?:Title|Meeting Title|#)\s*[:|-]?\s*/i, ''); this.updateTitle(); titleFound = true; return; }
                const match = trimmed.match(timePattern);
                if (match && (match[1].toUpperCase().includes('AM') || match[1].toUpperCase().includes('PM') || match[1].includes(':'))) {
                    if (currentItem) newAgenda.push(currentItem);
                    let timeStr = match[1].trim(); if (!/AM|PM/i.test(timeStr)) timeStr += " AM";
                    currentItem = { time: timeStr.toUpperCase(), title: match[2].trim() || "Topic Item", details: "" };
                } else if (currentItem) {
                    currentItem.details += (currentItem.details ? '\n' : '') + trimmed;
                }
            });
            if (currentItem) newAgenda.push(currentItem);
            
            if (newAgenda.length) {
                if (tabsPart) {
                    let currentTab = null;
                    tabsPart.split('\n').forEach(line => {
                        let l = line.trim();
                        if (l.match(/^#.*\[\s*x?\s*\]/i)) {
                            const isChecked = l.toLowerCase().includes('[x]');
                            const titleRaw = l.replace(/^#/, '').replace(/\[.*?\]/, '').trim();
                            
                            if (this.tabs.some(t => t.title === titleRaw)) {
                                currentTab = this.tabs.find(t => t.title === titleRaw);
                            } else {
                                if (!this.tabs[0]._touched) { currentTab = this.tabs[0]; this.tabs[0]._touched = true; }
                                else if (!this.tabs[1]._touched) { currentTab = this.tabs[1]; this.tabs[1]._touched = true; }
                                else if (!this.tabs[2]._touched) { currentTab = this.tabs[2]; this.tabs[2]._touched = true; }
                            }
                            if (currentTab) {
                                currentTab.enabled = isChecked;
                                currentTab.title = titleRaw || currentTab.title;
                                currentTab.content = '';
                            }
                        }
                        else if (currentTab && l) { currentTab.content += (currentTab.content ? '\n' : '') + line; }
                    });
                    this.tabs.forEach(t => delete t._touched);
                }
                
                this.historyStack = []; 
                this.agenda = newAgenda; this.currentIndex = 0; this.editingMode = 'agenda';
                this.buildDisplaySequence();
                localStorage.setItem(APP_CONFIG.storage.agendaKey, JSON.stringify(this.agenda)); 
                this.syncEditorInputs(); this.renderPresentationTextPages(); 
                this.syncToURL();
                this.importText = '';
            } else alert("Could not parse time indexes.");
        },
        
        clearAllStorage() {
            if (confirm("WARNING: This will permanently delete your locally saved agenda, tabs, theme, and meeting title. The app will reset. Continue?")) {
                localStorage.clear();
                window.location.hash = '';
                window.location.reload();
            }
        }
    }
}
</script>
