<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Meeting</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body, html { 
            height: 100%; 
            background: #e2e8f0; 
            color: #0f172a; 
            overflow-y: auto; 
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            transition: background 0.3s, color 0.3s;
        }
        
        .app-container { 
            display: flex; 
            flex-direction: column; 
            width: 100vw;
        }
        
        /* TOP SECTION: 16:9 Presentation Layer */
        .presentation-view {
            width: 100vw;
            min-height: 100vh;
            aspect-ratio: 16 / 9;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background: #f8fafc;
            border-bottom: 4px solid #cbd5e1;
            display: grid;
            grid-template-columns: 2fr 3fr;
            padding: 4% 4% 3% 4%;
            gap: 24px;
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }
        
        .status-panel { display: flex; flex-direction: column; justify-content: space-between; border-right: 2px solid #cbd5e1; padding-right: 24px; transition: border-color 0.3s; }
        .current-meta { display: flex; align-items: center; gap: 12px; color: #0284c7; font-weight: 800; letter-spacing: 0.05em; font-size: clamp(0.75rem, 1.5vw, 0.9rem); text-transform: uppercase; }
        .current-title { font-size: clamp(1.4rem, 3.5vw, 2.5rem); font-weight: 900; line-height: 1.2; color: #0f172a; margin-top: 8px; transition: color 0.3s; }
        .current-time-box { font-size: clamp(1rem, 2vw, 1.4rem); color: #475569; margin-top: 4px; font-weight: 600; transition: color 0.3s; }
        
        .system-clock { 
            background: #ffffff; 
            padding: 2px 10px; 
            border-radius: 20px; 
            font-size: clamp(0.7rem, 1.2vw, 0.85rem); 
            font-weight: 700; 
            color: #047857; 
            border: 1.5px solid #059669; 
            transition: background 0.3s, color 0.3s, border-color 0.3s; 
            text-transform: none;
            letter-spacing: normal;
        }

        /* NEXT UP NAV BAR */
        .next-up-container { display: flex; align-items: center; gap: 8px; }
        .prev-arrow-btn { 
            background: #f1f5f9; 
            border: 1px solid #cbd5e1; 
            color: #64748b; 
            border-radius: 8px; 
            padding: 12px 14px; 
            font-size: 1.1rem; 
            cursor: pointer; 
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .prev-arrow-btn:hover { background: #e2e8f0; color: #0f172a; }

        .next-up-card { 
            flex-grow: 1;
            background: #f1f5f9; 
            padding: 12px 16px; 
            border-radius: 8px; 
            border-left: 5px solid #7e22ce; 
            border-top: 1px solid #e2e8f0; 
            border-right: 1px solid #e2e8f0; 
            border-bottom: 1px solid #e2e8f0; 
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s; 
        }
        .next-up-card:hover { background: #e2e8f0; }
        .next-label { font-size: clamp(0.7rem, 1.2vw, 0.8rem); color: #7e22ce; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
        .next-title { font-size: clamp(0.95rem, 2vw, 1.2rem); font-weight: 700; color: #1e293b; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s; }
        
        .details-panel { position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; }
        .details-viewport { flex-grow: 1; overflow: hidden; position: relative; font-size: clamp(0.95rem, 2vw, 1.25rem); line-height: 1.6; color: #1e293b; font-weight: 500; transition: color 0.3s; }
        .details-page { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; transform: translateY(10px); transition: opacity 0.5s ease, transform 0.5s ease; pointer-events: none; }
        .details-page.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        
        .details-viewport ul { padding-left: 24px; margin-top: 8px; }
        .details-viewport li { margin-bottom: 6px; }
        .details-viewport p { margin-bottom: 8px; }

        /* BOTTOM SECTION: Management Layer */
        .management-view { 
            width: 100vw;
            min-height: 100vh;
            aspect-ratio: 16 / 9;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background: #cbd5e1; 
            display: grid; 
            grid-template-columns: 3fr 4fr; 
            padding: 3% 4%; 
            gap: 20px; 
            transition: background 0.3s;
        }
        
        .timeline-box { display: flex; flex-direction: column; background: #f1f5f9; border-radius: 8px; border: 1px solid #94a3b8; overflow: hidden; height: 100%; transition: background 0.3s, border-color 0.3s; }
        .timeline-header { padding: 10px 14px; background: #e2e8f0; font-weight: 700; font-size: clamp(0.75rem, 1.2vw, 0.9rem); color: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #cbd5e1; transition: background 0.3s, border-color 0.3s, color 0.3s; }
        .timeline-rows { flex-grow: 1; overflow-y: auto; }
        .timeline-item { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid #e2e8f0; cursor: pointer; transition: background 0.2s, color 0.2s; font-size: clamp(0.8rem, 1.5vw, 0.95rem); color: #334155; }
        .timeline-item:hover { background: #e2e8f0; }
        .timeline-item.active { background: #bae6fd; color: #0369a1; border-left: 5px solid #0284c7; font-weight: 700; }
        .item-time { width: 85px; font-weight: 700; color: #0284c7; }
        .item-text { flex-grow: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .control-bar { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { background: #cbd5e1; color: #0f172a; border: 1px solid #94a3b8; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: clamp(0.7rem, 1.2vw, 0.85rem); transition: background 0.2s, color 0.2s, border-color 0.2s; }
        .btn:hover { background: #94a3b8; }
        .btn-primary { background: #2563eb; color: #ffffff; border: none; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #059669; color: #ffffff; border: none; }
        .btn-success:hover { background: #047857; }
        .btn-danger { background: #dc2626; color: #ffffff; border: none; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-secondary { background: #64748b; color: #ffffff; border: none; }
        .btn-secondary:hover { background: #475569; }

        .editor-box { background: #f1f5f9; border-radius: 8px; border: 1px solid #94a3b8; padding: 14px; display: flex; flex-direction: column; gap: 10px; height: 100%; transition: background 0.3s, border-color 0.3s; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: clamp(0.65rem, 1vw, 0.8rem); font-weight: 800; color: #475569; text-transform: uppercase; transition: color 0.3s; }
        .form-inline { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
        input, textarea { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; color: #0f172a; padding: 8px 10px; font-size: clamp(0.8rem, 1.4vw, 0.95rem); font-weight: 500; transition: background 0.3s, border-color 0.3s, color 0.3s; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; }
        textarea { flex-grow: 1; resize: none; min-height: 80px; }

        /* DARK MODE OVERRIDES */
        body.dark-mode { background: #0f172a; color: #f8fafc; }
        body.dark-mode .presentation-view { background: #1e293b; border-bottom-color: #334155; }
        body.dark-mode .status-panel { border-right-color: #334155; }
        body.dark-mode .current-meta { color: #38bdf8; }
        body.dark-mode .current-title { color: #ffffff; }
        body.dark-mode .current-time-box { color: #94a3b8; }
        body.dark-mode .prev-arrow-btn { background: #0f172a; border-color: #334155; color: #94a3b8; }
        body.dark-mode .prev-arrow-btn:hover { background: #334155; color: #ffffff; }
        body.dark-mode .next-up-card { background: #0f172a; border-color: #334155; }
        body.dark-mode .next-up-card:hover { background: #334155; }
        body.dark-mode .next-label { color: #c084fc; }
        body.dark-mode .next-title { color: #f1f5f9; }
        body.dark-mode .details-viewport { color: #cbd5e1; }
        body.dark-mode .system-clock { background: #0f172a; color: #10b981; border-color: #10b981; }
        body.dark-mode .management-view { background: #0f172a; }
        body.dark-mode .timeline-box, body.dark-mode .editor-box { background: #1e293b; border-color: #334155; }
        body.dark-mode .timeline-header { background: #334155; color: #e2e8f0; border-bottom-color: #475569; }
        body.dark-mode .timeline-item { color: #cbd5e1; border-bottom-color: #334155; }
        body.dark-mode .timeline-item:hover { background: #334155; }
        body.dark-mode .timeline-item.active { background: #1e3a8a; color: #38bdf8; border-left-color: #38bdf8; }
        body.dark-mode input, body.dark-mode textarea { background: #0f172a; color: #ffffff; border-color: #334155; }
        body.dark-mode .form-group label { color: #94a3b8; }
        body.dark-mode .btn { background: #334155; color: #f8fafc; border-color: #475569; }
        body.dark-mode .btn:hover { background: #475569; }
        body.dark-mode .modal { background: #1e293b; border-color: #334155; }
        body.dark-mode .modal h3 { color: #f8fafc; }
        body.dark-mode .modal p { color: #94a3b8; }

        @media (orientation: portrait), (max-width: 768px) {
            .management-view {
                grid-template-columns: 1fr;
                aspect-ratio: auto;
                min-height: 100vh;
                padding: 16px;
                gap: 16px;
            }
            .timeline-box {
                min-height: 220px;
                max-height: 280px;
            }
            .editor-box {
                height: auto;
                min-height: 360px;
            }
        }

        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 20px; width: 90%; max-width: 550px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .modal h3 { font-size: 1.1rem; color: #0f172a; font-weight: 800; }
        .modal p { font-size: 0.8rem; color: #475569; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- TOP SECTION: PROJECTED 16:9 VIEWPORT -->
    <div class="presentation-view">
        <div class="status-panel">
            <div>
                <div class="current-meta">
                    <span>Now</span>
                    <span class="system-clock" id="sysClock">--:--:-- --</span>
                </div>
                <div id="presTitle" class="current-title">No Active Agenda Item</div>
                <div id="presTime" class="current-time-box">--:--</div>
            </div>
            
            <div class="next-up-container">
                <button class="prev-arrow-btn" onclick="shiftItem(-1)" title="Previous Topic">◀</button>
                <div class="next-up-card" onclick="shiftItem(1)" title="Advance to Next Topic">
                    <div class="next-label">Next Up</div>
                    <div id="presNext" class="next-title">Adjournment</div>
                </div>
            </div>
        </div>
        
        <div class="details-panel">
            <div class="details-viewport" id="viewport">
                <div class="details-page active" id="fallbackPage">
                    <p>No item details loaded.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM SECTION: MANAGEMENT VIEWPORT -->
    <div class="management-view">
        
        <div class="timeline-box">
            <div class="timeline-header">
                <span>Agenda</span>
                <div class="control-bar">
                    <button class="btn" onclick="shiftItem(-1)">◀ Prev</button>
                    <button class="btn" onclick="shiftItem(1)">Next ▶</button>
                    <button class="btn btn-primary" onclick="clearOverride()" id="resumeBtn" style="display:none;">Resume Auto</button>
                </div>
            </div>
            <div class="timeline-rows" id="timelineRows"></div>
        </div>
        
        <div class="editor-box">
            <div class="form-group">
                <label>Meeting Title</label>
                <input type="text" id="editMeetingTitle" placeholder="August 19, 2026" oninput="updateMeetingTitle(this.value)">
            </div>
            <div class="form-inline">
                <div class="form-group">
                    <label>Time</label>
                    <input type="text" id="editTime" placeholder="10:45 AM">
                </div>
                <div class="form-group">
                    <label>Topic Title</label>
                    <input type="text" id="editTitle" placeholder="Executive Review">
                </div>
            </div>
            <div class="form-group" style="flex-grow: 1;">
                <label>Topic Detail</label>
                <textarea id="editDetails" placeholder="<p>Overview parameters:</p><ul><li>First point</li></ul>"></textarea>
            </div>
            <div class="control-bar" style="justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="toggleTheme()" id="themeBtn">🌓 Dark Mode</button>
                <button class="btn btn-secondary" onclick="toggleFullscreen()">📺 Fullscreen</button>
                <button class="btn btn-success" onclick="shareAgendaURL()">🔗 Share Link</button>
                <button class="btn btn-secondary" onclick="openImportModal()">📥 Import</button>
                <button class="btn btn-danger" onclick="deleteCurrentItem()">Delete</button>
                <button class="btn btn-primary" onclick="saveEditorValues()">Save</button>
                <button class="btn btn-success" onclick="addNewItemBelow()">+ Add</button>
            </div>
        </div>

    </div>
</div>

<!-- TEXT / MARKDOWN IMPORT MODAL -->
<div class="modal-backdrop" id="importModal">
    <div class="modal">
        <h3>Bulk Import Agenda Text</h3>
        <p>Paste time-indexed text below (Optional first line: <code>Title: Meeting Name</code>):</p>
        <textarea id="importText" style="height: 140px;" placeholder="Title: August 19, 2026&#10;&#10;10:00 AM Call to Order&#10;- Roll call&#10;- Approve minutes"></textarea>
        <div class="control-bar" style="justify-content: flex-end;">
            <button class="btn btn-secondary" onclick="closeImportModal()">Cancel</button>
            <button class="btn btn-primary" onclick="processImportText()">Import Agenda</button>
        </div>
    </div>
</div>

<script>
    let meetingTitle = "";
    let wakeLock = null;

    const defaultAgenda = [
        { time: "10:35 AM", title: "Call to Order & Roll Call", details: "<p>Initial meeting protocols and legal establishment of the board quorum:</p><ul><li>Approval of previous executive session minutes.</li><li>Introduction of community observers and external stakeholders.</li></ul>" },
        { time: "10:45 AM", title: "Quarterly Financial Overview", details: "<p>Granular structural inspection of administrative balances across localized programs:</p><ul><li>Review of paperless utility updates and water infrastructure accounts.</li><li>Evaluation of capital allocations targeting regional youth programs.</li></ul>" },
        { time: "11:15 AM", title: "Facility Safety & Compliance", details: "<p>Ensuring full technical alignment with municipal regulatory framework criteria:</p><ul><li>Verification of structural audit pipelines for regional asset installations.</li><li>Updates on background check procedures and safety clearances.</li></ul>" }
    ];

    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {
                console.log(`Wake Lock Error: ${err.name}, ${err.message}`);
            }
        }
    }

    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });

    document.addEventListener('click', () => {
        if (!wakeLock) requestWakeLock();
    }, { once: true });

    function updateMeetingTitle(newTitle) {
        meetingTitle = newTitle ? newTitle.trim() : "";
        if (meetingTitle) {
            document.title = `Meeting - ${meetingTitle}`;
        } else {
            document.title = "Meeting";
        }
        localStorage.setItem('boardMeetingTitle', meetingTitle);
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('boardTheme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeBtn').innerText = '☀️ Light Mode';
        } else {
            document.body.classList.remove('dark-mode');
            document.getElementById('themeBtn').innerText = '🌓 Dark Mode';
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('boardTheme', isDark ? 'dark' : 'light');
        document.getElementById('themeBtn').innerText = isDark ? '☀️ Light Mode' : '🌓 Dark Mode';
    }

    function toggleFullscreen() {
        const docEl = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(err => alert("Fullscreen disabled by browser/iOS. Use 'Add to Home Screen' for chromeless view."));
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            } else {
                alert("Fullscreen API not supported on this browser. Tap Safari Share -> Add to Home Screen.");
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }

    async function encodeAgendaToURL(data) {
        const minifiedPayload = {
            m: meetingTitle,
            items: data.map(item => ({
                t: item.time,
                i: item.title,
                d: item.details.replace(/<\/?ul>/g, '').replace(/<li>/g, '- ').replace(/<\/li>/g, '\n').replace(/<p>/g, '').replace(/<\/p>/g, '\n').trim()
            }))
        };

        const jsonStr = JSON.stringify(minifiedPayload);
        const stream = new Blob([jsonStr]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        const compressedBuffer = await new Response(stream).arrayBuffer();
        
        const bytes = new Uint8Array(compressedBuffer);
        let binary = '';
        bytes.forEach(b => binary += String.fromCharCode(b));
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function decodeAgendaFromURL(base64Str) {
        let base64 = base64Str.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';

        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        const decompressedStr = await new Response(stream).text();
        const minifiedPayload = JSON.parse(decompressedStr);

        if (minifiedPayload.m !== undefined) {
            updateMeetingTitle(minifiedPayload.m);
            document.getElementById('editMeetingTitle').value = minifiedPayload.m;
        }

        const rawItems = minifiedPayload.items || minifiedPayload;

        return rawItems.map(item => {
            let detailsHtml = item.d;
            if (detailsHtml.includes('- ') || detailsHtml.includes('\n')) {
                const lines = detailsHtml.split('\n');
                let html = '';
                let inList = false;
                lines.forEach(l => {
                    const line = l.trim();
                    if (!line) return;
                    if (line.startsWith('- ')) {
                        if (!inList) { html += '<ul>'; inList = true; }
                        html += `<li>${line.replace(/^-\s*/, '')}</li>`;
                    } else {
                        if (inList) { html += '</ul>'; inList = false; }
                        html += `<p>${line}</p>`;
                    }
                });
                if (inList) html += '</ul>';
                detailsHtml = html;
            } else if (detailsHtml) {
                detailsHtml = `<p>${detailsHtml}</p>`;
            }
            return { time: item.t, title: item.i, details: detailsHtml };
        });
    }

    async function loadInitialAgenda() {
        const storedTitle = localStorage.getItem('boardMeetingTitle') || "August 19, 2026";
        updateMeetingTitle(storedTitle);
        document.getElementById('editMeetingTitle').value = storedTitle;

        if (window.location.hash.startsWith('#agenda=')) {
            try {
                const encodedData = window.location.hash.replace('#agenda=', '');
                const decoded = await decodeAgendaFromURL(encodedData);
                if (Array.isArray(decoded) && decoded.length > 0) {
                    localStorage.setItem('boardAgenda', JSON.stringify(decoded));
                    return decoded;
                }
            } catch (e) {
                console.error("Failed to decompress URL payload", e);
            }
        }
        
        const stored = localStorage.getItem('boardAgenda');
        if (stored) {
            try { return JSON.parse(stored); } catch (e) {}
        }
        return defaultAgenda;
    }

    function saveAgendaToStorage() {
        localStorage.setItem('boardAgenda', JSON.stringify(agenda));
    }

    let agenda = defaultAgenda;
    let currentIndex = 0;
    let isManualOverride = false;
    let carouselInterval = null;
    let lastCheckedMilestoneTime = "";

    function parseToMinutes(timeStr) {
        const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
        if (!match) return 0;
        let [_, hrs, mins, period] = match;
        hrs = parseInt(hrs);
        mins = parseInt(mins);
        if (period.toUpperCase() === "PM" && hrs !== 12) hrs += 12;
        if (period.toUpperCase() === "AM" && hrs === 12) hrs = 0;
        return hrs * 60 + mins;
    }

    function sortAgenda() {
        agenda.sort((a, b) => parseToMinutes(a.time) - parseToMinutes(b.time));
    }

    function updateSystemClock() {
        const now = new Date();
        let hrs = now.getHours();
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        const ampm = hrs >= 12 ? 'PM' : 'AM';
        hrs = hrs % 12;
        hrs = hrs ? hrs : 12;
        const normalizedHours = String(hrs).padStart(2, '0');
        const timeString = `${normalizedHours}:${mins}:${secs} ${ampm}`;
        document.getElementById('sysClock').innerText = timeString;

        const checkString = `${normalizedHours}:${mins} ${ampm}`;
        if (checkString !== lastCheckedMilestoneTime) {
            evaluateAutomatedTimeTrigger(checkString);
        }
    }

    function evaluateAutomatedTimeTrigger(currentWallTime) {
        let matchedIndex = -1;
        const currentMins = parseToMinutes(currentWallTime);

        for (let i = 0; i < agenda.length; i++) {
            if (parseToMinutes(agenda[i].time) <= currentMins) {
                matchedIndex = i;
            }
        }

        if (matchedIndex !== -1 && matchedIndex !== currentIndex && !isManualOverride) {
            lastCheckedMilestoneTime = currentWallTime;
            currentIndex = matchedIndex;
            renderState();
        } else if (matchedIndex !== -1 && isManualOverride) {
            const exactAgendaTime = agenda[matchedIndex].time.replace(/^0/, '');
            const exactWallTime = currentWallTime.replace(/^0/, '');
            if (exactAgendaTime === exactWallTime && lastCheckedMilestoneTime !== currentWallTime) {
                lastCheckedMilestoneTime = currentWallTime;
                isManualOverride = false;
                currentIndex = matchedIndex;
                renderState();
            }
        }
    }

    function renderPresentationTextPages() {
        const container = document.getElementById('viewport');
        clearInterval(carouselInterval);
        container.innerHTML = "";

        if (agenda.length === 0 || !agenda[currentIndex]) {
            container.innerHTML = '<div class="details-page active"><p>No item details loaded.</p></div>';
            return;
        }

        const testDiv = document.createElement('div');
        testDiv.style.width = `${container.clientWidth}px`;
        testDiv.style.position = 'absolute';
        testDiv.style.visibility = 'hidden';
        testDiv.style.fontSize = '1.25rem';
        testDiv.style.lineHeight = '1.6';
        testDiv.innerHTML = agenda[currentIndex].details;
        document.body.appendChild(testDiv);

        const childElements = Array.from(testDiv.childNodes);
        const pagesData = [];
        let currentPageHTML = "";
        let currentHeight = 0;
        const maxHeight = container.clientHeight - 20;

        childElements.forEach(node => {
            const tempBox = document.createElement('div');
            tempBox.style.width = `${container.clientWidth}px`;
            tempBox.style.fontSize = '1.25rem';
            tempBox.style.lineHeight = '1.6';
            const clone = node.cloneNode(true);
            tempBox.appendChild(clone);
            document.body.appendChild(tempBox);

            const nodeHeight = tempBox.clientHeight;
            document.body.removeChild(tempBox);

            if (currentHeight + nodeHeight > maxHeight && currentPageHTML !== "") {
                pagesData.push(currentPageHTML);
                currentPageHTML = "";
                currentHeight = 0;
            }

            if (node.nodeType === Node.TEXT_NODE) {
                currentPageHTML += node.textContent;
            } else {
                currentPageHTML += node.outerHTML;
            }
            currentHeight += nodeHeight;
        });

        if (currentPageHTML !== "") pagesData.push(currentPageHTML);
        document.body.removeChild(testDiv);

        pagesData.forEach((pageHTML, idx) => {
            const pageDiv = document.createElement('div');
            pageDiv.className = `details-page ${idx === 0 ? 'active' : ''}`;
            pageDiv.innerHTML = pageHTML;
            container.appendChild(pageDiv);
        });

        if (pagesData.length > 1) {
            let activePageIdx = 0;
            carouselInterval = setInterval(() => {
                const pages = container.querySelectorAll('.details-page');
                if (pages.length === 0) return;
                pages[activePageIdx].classList.remove('active');
                activePageIdx = (activePageIdx + 1) % pages.length;
                pages[activePageIdx].classList.add('active');
            }, 8000);
        }
    }

    function renderState() {
        sortAgenda();
        if (currentIndex >= agenda.length) currentIndex = Math.max(0, agenda.length - 1);
        
        const activeItem = agenda[currentIndex];
        const nextItem = agenda[currentIndex + 1];

        if (activeItem) {
            document.getElementById('presTitle').innerText = activeItem.title;
            document.getElementById('presTime').innerText = `Scheduled: ${activeItem.time}`;
        } else {
            document.getElementById('presTitle').innerText = "End of Agenda";
            document.getElementById('presTime').innerText = "--:--";
        }

        if (nextItem) {
            document.getElementById('presNext').innerText = `${nextItem.time} - ${nextItem.title}`;
        } else {
            document.getElementById('presNext').innerText = "Adjournment / Session Closed";
        }

        document.getElementById('resumeBtn').style.display = isManualOverride ? 'inline-block' : 'none';

        const rowsBox = document.getElementById('timelineRows');
        rowsBox.innerHTML = "";
        agenda.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = `timeline-item ${index === currentIndex ? 'active' : ''}`;
            row.innerHTML = `<div class="item-time">${item.time}</div> <div class="item-text">${item.title}</div>`;
            row.onclick = () => {
                isManualOverride = true;
                currentIndex = index;
                renderState();
            };
            rowsBox.appendChild(row);
        });

        if (activeItem) {
            document.getElementById('editTime').value = activeItem.time;
            document.getElementById('editTitle').value = activeItem.title;
            document.getElementById('editDetails').value = activeItem.details;
        } else {
            clearEditorInputs();
        }

        renderPresentationTextPages();
    }

    function shiftItem(direction) {
        isManualOverride = true;
        let targetIndex = currentIndex + direction;
        if (targetIndex >= 0 && targetIndex < agenda.length) {
            currentIndex = targetIndex;
            renderState();
        }
    }

    function clearOverride() {
        isManualOverride = false;
        lastCheckedMilestoneTime = "";
        const now = new Date();
        let hrs = now.getHours();
        const mins = String(now.getMinutes()).padStart(2, '0');
        const ampm = hrs >= 12 ? 'PM' : 'AM';
        hrs = hrs % 12;
        hrs = hrs ? hrs : 12;
        evaluateAutomatedTimeTrigger(`${String(hrs).padStart(2, '0')}:${mins} ${ampm}`);
        renderState();
    }

    function saveEditorValues() {
        const timeInput = document.getElementById('editTime').value.trim();
        const titleInput = document.getElementById('editTitle').value.trim();
        const detailsInput = document.getElementById('editDetails').value.trim();

        if (!timeInput || !titleInput) {
            alert("Time and title parameters are required.");
            return;
        }

        const payload = { time: timeInput, title: titleInput, details: detailsInput || "" };

        if (agenda[currentIndex]) {
            agenda[currentIndex] = payload;
        } else {
            agenda.push(payload);
            currentIndex = agenda.length - 1;
        }
        
        saveAgendaToStorage();
        renderState();
    }

    function addNewItemBelow() {
        const timeInput = document.getElementById('editTime').value.trim() || "12:00 PM";
        const titleInput = document.getElementById('editTitle').value.trim() || "New Topic";
        const detailsInput = document.getElementById('editDetails').value.trim() || "";

        const newItem = { time: timeInput, title: titleInput, details: detailsInput };
        
        const insertAt = currentIndex + 1;
        agenda.splice(insertAt, 0, newItem);
        currentIndex = insertAt;
        
        saveAgendaToStorage();
        renderState();
    }

    function deleteCurrentItem() {
        if (agenda.length <= 1) {
            alert("At least one agenda topic is required.");
            return;
        }
        agenda.splice(currentIndex, 1);
        currentIndex = Math.max(0, currentIndex - 1);
        saveAgendaToStorage();
        renderState();
    }

    async function shareAgendaURL() {
        try {
            const compressedHash = await encodeAgendaToURL(agenda);
            const shareURL = `${window.location.origin}${window.location.pathname}#agenda=${compressedHash}`;
            
            await navigator.clipboard.writeText(shareURL);
            alert(`Compressed Share Link copied! (${shareURL.length} chars)`);
        } catch (e) {
            console.error("Compression error:", e);
            alert("Failed to generate compressed share link.");
        }
    }

    function openImportModal() { document.getElementById('importModal').style.display = 'flex'; }
    function closeImportModal() { document.getElementById('importModal').style.display = 'none'; }

    function processImportText() {
        const rawText = document.getElementById('importText').value.trim();
        if (!rawText) return;

        const lines = rawText.split('\n');
        const timePattern = /^(\d{1,2}:\d{2}\s*(?:AM|PM|am|pm)?)\s*[-:]?\s*(.*)$/i;
        const newAgenda = [];
        let currentItem = null;
        let inList = false;
        let titleFound = false;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            if (!titleFound && newAgenda.length === 0 && !currentItem && !timePattern.test(trimmed)) {
                const cleanTitle = trimmed.replace(/^(?:Title|Meeting Title|#)\s*[:|-]?\s*/i, '');
                updateMeetingTitle(cleanTitle);
                document.getElementById('editMeetingTitle').value = cleanTitle;
                titleFound = true;
                return;
            }

            const match = trimmed.match(timePattern);
            if (match && (match[1].toUpperCase().includes('AM') || match[1].toUpperCase().includes('PM') || match[1].includes(':'))) {
                if (currentItem) {
                    if (inList) currentItem.details += '</ul>';
                    newAgenda.push(currentItem);
                }
                let timeStr = match[1].trim();
                if (!/AM|PM/i.test(timeStr)) timeStr += " AM";
                currentItem = { time: timeStr.toUpperCase(), title: match[2].trim() || "Topic Item", details: "" };
                inList = false;
            } else if (currentItem) {
                if (trimmed.startsWith('-') || trimmed.startsWith('*')) {
                    if (!inList) { currentItem.details += '<ul>'; inList = true; }
                    currentItem.details += `<li>${trimmed.replace(/^[-*]\s*/, '')}</li>`;
                } else {
                    if (inList) { currentItem.details += '</ul>'; inList = false; }
                    currentItem.details += `<p>${trimmed}</p>`;
                }
            }
        });

        if (currentItem) {
            if (inList) currentItem.details += '</ul>';
            newAgenda.push(currentItem);
        }

        if (newAgenda.length > 0) {
            agenda = newAgenda;
            currentIndex = 0;
            saveAgendaToStorage();
            renderState();
            closeImportModal();
        } else {
            alert("Could not parse time indexes.");
        }
    }

    function clearEditorInputs() {
        document.getElementById('editTime').value = "";
        document.getElementById('editTitle').value = "";
        document.getElementById('editDetails').value = "";
    }

    window.addEventListener('resize', renderPresentationTextPages);
    setInterval(updateSystemClock, 1000);

    (async function init() {
        initTheme();
        await requestWakeLock();
        agenda = await loadInitialAgenda();
        const initialNow = new Date();
        let initHrs = initialNow.getHours();
        const initMins = String(initialNow.getMinutes()).padStart(2, '0');
        const initAmpm = initHrs >= 12 ? 'PM' : 'AM';
        initHrs = initHrs % 12;
        initHrs = initHrs ? initHrs : 12;
        evaluateAutomatedTimeTrigger(`${String(initHrs).padStart(2, '0')}:${initMins} ${initAmpm}`);
        renderState();
    })();
</script>

</body>
